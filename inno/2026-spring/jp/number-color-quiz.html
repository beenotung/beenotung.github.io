<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>數字與顏色小測驗</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="menu.css">
  <style>
    :root {
      --bg-start: #fff8ec;
      --bg-end: #ffe8d5;
      --primary: #f97f57;
      --primary-dark: #e65531;
      --accent: #ffcfac;
      --text: #3a2315;
      --light-text: #6f4a31;
      --card: #ffffff;
      --success: #2d9f6c;
      --danger: #d9534f;
      --hint: #3d5afe;
      --shadow: rgba(249,127,87,0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
      color: var(--text);
    }

    nav {
      background: rgba(255, 255, 255, 0.92);
      padding: 16px 20px;
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 1000;
      box-shadow: 0 3px 20px var(--shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-toggle {
      display: none;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text);
    }

    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    nav a {
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.25s ease;
    }

    nav a:hover,
    nav a.active {
      color: var(--primary-dark);
    }

    .side-menu {
      display: none;
    }

    @media (max-width: 820px) {
      .nav-toggle { display: block; }
      nav ul { display: none; }
      .side-menu {
        display: block;
        position: fixed;
        top: 64px;
        right: -100%;
        width: 72%;
        max-width: 280px;
        height: calc(100vh - 64px);
        background: rgba(255, 255, 255, 0.98);
        box-shadow: -2px 0 20px var(--shadow);
        transition: right 0.28s ease;
        padding: 22px;
        overflow-y: auto;
      }
      .side-menu.open {
        right: 0;
      }
      .overlay {
        display: none;
        position: fixed;
        top: 64px;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.28);
        z-index: 999;
      }
      .overlay.show { display: block; }
      .side-menu ul { list-style: none; padding: 0; margin: 0; }
      .side-menu li + li { margin-top: 12px; }
      .side-menu a { display: block; padding: 10px 0; color: var(--text); }
    }

    main {
      padding-top: 100px;
      max-width: 1100px;
      margin: 0 auto;
      padding-left: 20px;
      padding-right: 20px;
      text-align: center;
    }

    .hero {
      max-width: 760px;
      margin: 0 auto 40px;
      padding: 40px 28px;
      background: rgba(255,255,255,0.85);
      border-radius: 26px;
      box-shadow: 0 18px 40px var(--shadow);
      border: 1px solid rgba(249,127,87,0.18);
    }

    .hero h1 {
      margin: 0 0 18px;
      font-family: 'Poppins', sans-serif;
      font-size: 3rem;
      color: var(--primary-dark);
    }

    .hero p {
      margin: 0;
      font-size: 1.15rem;
      color: var(--light-text);
      line-height: 1.7;
    }

    .quiz-card {
      max-width: 760px;
      margin: 0 auto 50px;
      padding: 38px 36px;
      background: var(--card);
      border-radius: 28px;
      border: 2px solid rgba(249,127,87,0.18);
      box-shadow: 0 18px 45px var(--shadow);
      text-align: left;
    }

    .quiz-top {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: center;
      margin-bottom: 32px;
    }

    .quiz-top .timer-panel,
    .quiz-top .stats-panel {
      background: #fbf2ea;
      border-radius: 20px;
      padding: 18px 22px;
      border: 1px solid rgba(249,127,87,0.14);
    }

    .timer-label,
    .stats-label {
      display: block;
      font-size: 0.95rem;
      color: var(--light-text);
      margin-bottom: 6px;
    }

    .timer-value {
      font-size: 2.8rem;
      font-weight: 700;
      color: var(--primary-dark);
      letter-spacing: 0.04em;
    }

    .progress-track {
      width: 100%;
      height: 14px;
      background: rgba(243, 211, 191, 0.7);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 12px;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, #ffb47c, #f97f57);
      transition: width 0.35s ease;
    }

    .stats-panel {
      min-width: 180px;
    }

    .stats-count {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text);
    }

    .quiz-question {
      font-size: 1.45rem;
      font-weight: 500;
      margin: 0 0 24px;
      color: var(--text);
      line-height: 1.5;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .option-card {
      padding: 18px 20px;
      border-radius: 18px;
      border: 2px solid rgba(249,127,87,0.18);
      background: #fff7f0;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
      font-size: 1.05rem;
      color: var(--light-text);
      min-height: 80px;
      display: flex;
      align-items: center;
    }

    .option-card:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
      background: #ffe7d8;
    }

    .option-card.correct {
      background: #d9f0e6;
      border-color: #2d9f6c;
      color: #23573e;
    }

    .option-card.wrong {
      background: #f8dad7;
      border-color: #d9534f;
      color: #7b2a26;
    }

    .feedback-panel {
      margin-top: 22px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .feedback-message {
      min-height: 32px;
      font-size: 1.1rem;
      font-weight: 500;
    }

    .feedback-message.correct { color: #2d9f6c; }
    .feedback-message.wrong { color: #d9534f; }
    .feedback-message.neutral { color: var(--light-text); }

    .hint-button,
    .next-button,
    .start-button {
      border: none;
      border-radius: 14px;
      padding: 12px 18px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.25s ease, transform 0.2s ease;
    }

    .hint-button {
      background: #eef3ff;
      color: var(--hint);
    }

    .hint-button:hover { transform: translateY(-1px); background: #dae2ff; }

    .next-button {
      background: var(--primary);
      color: #fff;
    }

    .next-button:hover { background: var(--primary-dark); }

    .start-button {
      background: #3d5afe;
      color: #fff;
      width: 100%;
      max-width: 240px;
      margin-top: 12px;
    }

    .result-panel {
      margin-top: 26px;
      padding: 20px 22px;
      border-radius: 20px;
      background: #fff6ef;
      border: 1px solid rgba(249,127,87,0.14);
    }

    .result-panel h3 {
      margin: 0 0 12px;
      font-size: 1.3rem;
      color: var(--primary-dark);
    }

    .result-panel p {
      margin: 6px 0;
      color: var(--light-text);
      font-size: 1rem;
    }

    @media (max-width: 768px) {
      .quiz-top { grid-template-columns: 1fr; }
      .options-grid { grid-template-columns: 1fr; }
      .quiz-card { padding: 28px 20px; }
      .hero h1 { font-size: 2.4rem; }
    }
  </style>
</head>
<body>
  <div id="menu-container"></div>
  <main>
    <section class="hero">
      <h1>數字與顏色小測驗</h1>
      <p>在 2 分鐘內完成盡可能多的題目。每題使用即時回饋，若需要提示，可點選按鈕查看正確答案。</p>
    </section>

    <section class="quiz-card">
      <div class="quiz-top">
        <div class="timer-panel">
          <span class="timer-label">剩餘時間</span>
          <span class="timer-value" id="timerValue">02:00</span>
          <div class="progress-track">
            <div class="progress-fill" id="timerFill"></div>
          </div>
        </div>

        <div class="stats-panel">
          <span class="stats-label">已答題 / 上限</span>
          <div class="stats-count" id="questionCount">0 / 12</div>
          <span class="stats-label">正確題數</span>
          <div class="stats-count" id="correctCount">0</div>
        </div>
      </div>

      <div class="quiz-question" id="quizQuestion">點選「開始」以啟動測驗。</div>

      <div class="options-grid" id="optionsGrid">
        <button class="option-card" disabled>選項 A</button>
        <button class="option-card" disabled>選項 B</button>
        <button class="option-card" disabled>選項 C</button>
        <button class="option-card" disabled>選項 D</button>
      </div>

      <div class="feedback-panel">
        <div class="feedback-message neutral" id="feedbackMessage">測驗尚未開始。</div>
        <button class="hint-button" id="readButton" disabled>朗讀正確答案</button>
        <button class="next-button" id="nextButton" disabled>下一題</button>
      </div>

      <button class="start-button" id="startButton">開始 2 分鐘挑戰</button>

      <div class="result-panel" id="resultPanel" style="display:none;">
        <h3>時間到！挑戰結束</h3>
        <p>完成題數：<strong id="finalQuestionCount">0</strong></p>
        <p>答對題數：<strong id="finalCorrectCount">0</strong></p>
        <p>準確率：<strong id="finalAccuracy">0%</strong></p>
      </div>
    </section>
  </main>

  <script>
    const questions = [
      {
        question: '下面哪一個日語單字表示紅色？',
        options: ['あお', 'あか', 'みどり', 'きいろ'],
        correct: 1,
      },
      {
        question: '下面哪一個日語單字表示綠色？',
        options: ['むらさき', 'みどり', 'しろ', 'くろ'],
        correct: 1,
      },
      {
        question: '下面哪一個日語讀音代表數字 1？',
        options: ['いち', 'に', 'さん', 'し'],
        correct: 0,
      },
      {
        question: '下面哪一個日語讀音代表數字 6？',
        options: ['ご', 'ろく', 'しち', 'はち'],
        correct: 1,
      },
      {
        question: '下面哪一個日語單字表示黃色？',
        options: ['くろ', 'きいろ', 'ぴんく', 'こん'],
        correct: 1,
      },
      {
        question: '下面哪一個日語讀音代表數字 3？',
        options: ['さん', 'し', 'ろく', 'じゅう'],
        correct: 0,
      },
      {
        question: '下面哪一個日語單字表示白色？',
        options: ['しろ', 'あお', 'くろ', 'きいろ'],
        correct: 0,
      },
      {
        question: '下面哪一個日語讀音代表數字 7？',
        options: ['ご', 'しち', 'きゅう', 'じゅういち'],
        correct: 1,
      },
      {
        question: '下面哪一個日語單字表示黑色？',
        options: ['あか', 'しろ', 'くろ', 'みどり'],
        correct: 2,
      },
      {
        question: '下面哪一個日語讀音代表數字 10？',
        options: ['はち', 'きゅう', 'じゅう', 'じゅういち'],
        correct: 2,
      },
      {
        question: '下面哪一個日語單字表示藍色？',
        options: ['むらさき', 'あか', 'みどり', 'あお'],
        correct: 3,
      },
      {
        question: '下面哪一個日語讀音代表數字 5？',
        options: ['よん', 'ご', 'ろく', 'なな'],
        correct: 1,
      }
    ];

    const totalQuestions = questions.length;
    const timerValue = document.getElementById('timerValue');
    const timerFill = document.getElementById('timerFill');
    const questionCount = document.getElementById('questionCount');
    const correctCount = document.getElementById('correctCount');
    const quizQuestion = document.getElementById('quizQuestion');
    const optionsGrid = document.getElementById('optionsGrid');
    const feedbackMessage = document.getElementById('feedbackMessage');
    const readButton = document.getElementById('readButton');
    const nextButton = document.getElementById('nextButton');
    const startButton = document.getElementById('startButton');
    const resultPanel = document.getElementById('resultPanel');
    const finalQuestionCount = document.getElementById('finalQuestionCount');
    const finalCorrectCount = document.getElementById('finalCorrectCount');
    const finalAccuracy = document.getElementById('finalAccuracy');

    let currentIndex = 0;
    let answeredCount = 0;
    let correctAnswerCount = 0;
    let remainingSeconds = 120;
    let timerId = null;
    let autoAdvanceTimeout = null;
    let questionOrder = [];
    let currentQuestion = null;

    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60).toString().padStart(2, '0');
      const secs = (seconds % 60).toString().padStart(2, '0');
      return `${minutes}:${secs}`;
    }

    function updateTimerDisplay() {
      timerValue.textContent = formatTime(remainingSeconds);
      timerFill.style.width = `${(remainingSeconds / 120) * 100}%`;
    }

    function updateCounters() {
      questionCount.textContent = `${answeredCount} / ${totalQuestions}`;
      correctCount.textContent = `${correctAnswerCount}`;
    }

    function resetQuiz() {
      answeredCount = 0;
      correctAnswerCount = 0;
      remainingSeconds = 120;
      currentIndex = 0;
      questionOrder = shuffle(Array.from({ length: totalQuestions }, (_, idx) => idx));
      currentQuestion = null;
      if (autoAdvanceTimeout) {
        clearTimeout(autoAdvanceTimeout);
        autoAdvanceTimeout = null;
      }
      updateTimerDisplay();
      updateCounters();
      feedbackMessage.textContent = '點選「開始」以啟動測驗。';
      feedbackMessage.className = 'feedback-message neutral';
      readButton.disabled = true;
      nextButton.disabled = true;
      enableOptionButtons(false);
      resultPanel.style.display = 'none';
      quizQuestion.textContent = '準備好了嗎？2 分鐘內答對盡可能多的題目。';
    }

    function enableOptionButtons(enable) {
      Array.from(optionsGrid.children).forEach(button => {
        button.disabled = !enable;
        button.classList.remove('correct', 'wrong');
        button.style.pointerEvents = enable ? 'auto' : 'none';
      });
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function loadCurrentQuestion() {
      if (currentIndex >= totalQuestions) {
        endQuiz();
        return;
      }

      const questionData = questions[questionOrder[currentIndex]];
      currentQuestion = questionData;
      quizQuestion.textContent = `${currentIndex + 1}. ${questionData.question}`;
      Array.from(optionsGrid.children).forEach((button, idx) => {
        button.textContent = questionData.options[idx];
        button.dataset.index = idx;
        button.classList.remove('correct', 'wrong');
      });
      feedbackMessage.textContent = '請從下方選項中作答。';
      feedbackMessage.className = 'feedback-message neutral';
      readButton.disabled = false;
      nextButton.disabled = true;
      enableOptionButtons(true);
    }

    function endQuiz() {
      clearInterval(timerId);
      timerId = null;
      if (autoAdvanceTimeout) {
        clearTimeout(autoAdvanceTimeout);
        autoAdvanceTimeout = null;
      }
      enableOptionButtons(false);
      readButton.disabled = true;
      nextButton.disabled = true;
      startButton.textContent = '重新開始挑戰';
      resultPanel.style.display = 'block';
      finalQuestionCount.textContent = answeredCount;
      finalCorrectCount.textContent = correctAnswerCount;
      const accuracy = answeredCount === 0 ? 0 : Math.round((correctAnswerCount / answeredCount) * 100);
      finalAccuracy.textContent = `${accuracy}%`;
      if (remainingSeconds <= 0) {
        feedbackMessage.textContent = '時間到！請查看成績，然後再挑戰一次。';
        feedbackMessage.className = 'feedback-message neutral';
      }
    }

    function handleAnswer(button) {
      if (!currentQuestion) return;
      const selectedIndex = Number(button.dataset.index);
      enableOptionButtons(false);
      Array.from(optionsGrid.children).forEach(option => {
        option.style.pointerEvents = 'none';
        if (Number(option.dataset.index) === currentQuestion.correct) {
          option.classList.add('correct');
        }
      });

      answeredCount += 1;
      const correctText = currentQuestion.options[currentQuestion.correct];
      if (selectedIndex === currentQuestion.correct) {
        correctAnswerCount += 1;
        feedbackMessage.textContent = `✓ 正確！答案是「${correctText}」。`;
        feedbackMessage.className = 'feedback-message correct';
      } else {
        button.classList.add('wrong');
        feedbackMessage.textContent = `✗ 答錯了，正確答案是「${correctText}」。`;
        feedbackMessage.className = 'feedback-message wrong';
      }

      updateCounters();
      nextButton.disabled = false;
      readButton.disabled = false;
      if (autoAdvanceTimeout) {
        clearTimeout(autoAdvanceTimeout);
      }
      autoAdvanceTimeout = setTimeout(() => {
        if (remainingSeconds > 0 && currentIndex < totalQuestions) {
          nextQuestion();
        }
      }, 1500);
    }

    function speakText(text) {
      if (!window.speechSynthesis) return;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ja-JP';
      utterance.rate = 0.95;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
    }

    function nextQuestion() {
      if (autoAdvanceTimeout) {
        clearTimeout(autoAdvanceTimeout);
        autoAdvanceTimeout = null;
      }
      currentIndex += 1;
      if (remainingSeconds <= 0 || currentIndex >= totalQuestions) {
        endQuiz();
        return;
      }
      loadCurrentQuestion();
    }

    function startTimer() {
      if (timerId) return;
      timerId = setInterval(() => {
        remainingSeconds -= 1;
        updateTimerDisplay();
        if (remainingSeconds <= 0) {
          remainingSeconds = 0;
          updateTimerDisplay();
          endQuiz();
        }
      }, 1000);
    }

    function startQuiz() {
      resetQuiz();
      startTimer();
      loadCurrentQuestion();
      startButton.textContent = '進行中...';
    }

    optionsGrid.addEventListener('click', event => {
      const button = event.target.closest('.option-card');
      if (!button || button.disabled) return;
      handleAnswer(button);
    });

    readButton.addEventListener('click', () => {
      if (!currentQuestion) return;
      const correctText = currentQuestion.options[currentQuestion.correct];
      speakText(correctText);
    });
    nextButton.addEventListener('click', nextQuestion);
    startButton.addEventListener('click', startQuiz);

    resetQuiz();
  </script>
  <script src="menu.js"></script>
</body>
</html>
