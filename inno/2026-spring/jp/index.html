<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>櫻花森林 - Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="menu.css">
  <style>
    :root {
      --bg-start: #fff5f8;
      --bg-end:   #ffeef2;
      --primary:  #ff8cab;     /* soft bright pink */
      --primary-dark: #f06292;
      --accent:   #ffb3c6;
      --text:     #3a1f2c;
      --text-light: #5c3f4e;
      --card-bg:  #ffffff;
      --shadow:   rgba(255,140,171,0.18);
    }

    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
      color: var(--text);
      min-height: 100vh;
    }

    nav {
      background: rgba(255, 255, 255, 0.8);
      padding: 15px 20px;
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 10px var(--shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-toggle {
      display: none;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text);
    }

    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    nav a {
      text-decoration: none;
      color: var(--text);
      font-weight: 500;
      font-size: 1.1rem;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: var(--primary);
    }

    .side-menu {
      display: none;
    }

    @media (max-width: 768px) {
      .nav-toggle {
        display: block;
      }
      nav ul {
        display: none;
      }
      .side-menu {
        display: block;
        position: fixed;
        top: 60px;
        right: -100%;
        width: 70%;
        max-width: 280px;
        height: calc(100vh - 60px);
        background: rgba(255, 255, 255, 0.95);
        box-shadow: -2px 0 10px var(--shadow);
        transition: right 0.3s ease;
        padding: 20px;
        overflow-y: auto;
      }
      .side-menu.open {
        right: 0;
      }
      .side-menu ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .side-menu li {
        margin: 12px 0;
      }
      .side-menu a {
        text-decoration: none;
        color: var(--text);
        font-weight: 500;
        font-size: 1.1rem;
        display: block;
        padding: 10px;
        border-radius: 8px;
      }
      .side-menu a:hover {
        background: var(--accent);
      }
      .overlay {
        display: none;
        position: fixed;
        top: 60px;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0,0,0,0.3);
        z-index: 999;
      }
      .overlay.show {
        display: block;
      }
    }

    header {
      text-align: center;
      padding: 160px 20px 110px;
      background: linear-gradient(to bottom, rgba(255,179,198,0.22), transparent);
      position: relative;
      overflow: hidden;
      margin-top: 60px; /* Offset for fixed nav */
    }

    header::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url('https://thumbs.dreamstime.com/b/sakura-tree-branch-petals-falling-butterfly-flying-soft-golden-light-delicate-cherry-blossom-branch-bursts-pink-427921448.jpg') center/cover;
      opacity: 0.09;
      z-index: -1;
    }

    h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 4.4rem;
      font-weight: 600;
      color: var(--primary);
      margin: 0 0 20px;
      text-shadow: 0 4px 20px rgba(255,140,171,0.25);
    }

    .tagline {
      font-size: 1.65rem;
      color: var(--text-light);
      margin-bottom: 50px;
      font-weight: 400;
    }

    .cta {
      background: var(--primary);
      color: white;
      border: none;
      padding: 18px 56px;
      font-size: 1.35rem;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 10px 30px var(--shadow);
      transition: all 0.35s ease;
      margin: 10px;
    }

    .cta:hover {
      background: var(--primary-dark);
      transform: translateY(-4px) scale(1.04);
      box-shadow: 0 16px 40px rgba(240,98,146,0.35);
    }

    section {
      padding: 90px 20px;
      max-width: 1180px;
      margin: 0 auto;
    }

    h2 {
      text-align: center;
      font-size: 2.8rem;
      color: var(--primary);
      margin-bottom: 70px;
      font-weight: 500;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 40px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: 0 12px 32px var(--shadow);
      border: 1px solid #ffe4ed;
      transition: all 0.4s ease;
      text-align: center;
    }

    .card:hover {
      transform: translateY(-12px);
      box-shadow: 0 24px 48px rgba(255,140,171,0.25);
      border-color: var(--accent);
    }

    .emoji {
      font-size: 4rem;
      margin-bottom: 24px;
    }

    .card h3 {
      color: var(--primary);
      margin-bottom: 16px;
      font-size: 1.5rem;
      font-weight: 500;
    }

    .card p {
      color: var(--text-light);
      line-height: 1.6;
    }

    .devices {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin: 50px 0;
    }

    .device-icon {
      font-size: 3rem;
      color: var(--primary);
    }

    .launch-notice {
      text-align: center;
      background: var(--accent);
      padding: 20px;
      border-radius: 12px;
      margin: 50px auto;
      max-width: 600px;
      color: var(--text);
      font-size: 1.2rem;
    }

    @media (max-width: 768px) {
      h1 { font-size: 3.4rem; }
      .cta { padding: 16px 48px; font-size: 1.25rem; }
      .devices { flex-wrap: wrap; gap: 20px; }
    }
  </style>
</head>
<body>

  <div id="menu-container"></div>

  <header>
    <h1>🌸 櫻花森林 Galgame 🌸</h1>
    <div class="tagline">用劇情種樹，活學日文＋日本文化</div>
    <button class="cta">✅ Start Learning</button>
    <button class="cta">🎮 Try Demo</button>
    <button class="cta">✅ Apply for Early Access</button>
  </header>

  <section>
    <h2>🎮 What You Can Do</h2>
    <div class="grid">
      <div class="card">
        <div class="emoji">🌸</div>
        <h3>Focus 10 minutes → Grow sakura tree</h3>
        <p>專注學習，種植你的櫻花樹，解鎖更多內容</p>
      </div>

      <div class="card">
        <div class="emoji">📖</div>
        <h3>Unlock story chapters</h3>
        <p>透過學習解鎖劇情章節，體驗多結局故事</p>
      </div>

      <div class="card">
        <div class="emoji">🗼</div>
        <h3>Learn through real Japanese life simulation</h3>
        <p>模擬真實日本生活，學習語言與文化</p>
      </div>
    </div>
  </section>

  <section>
    <h2>📱 Device Integration</h2>
    <div class="devices">
      <div class="device-icon">📱</div> <!-- Phone -->
      <div class="device-icon">⌚</div> <!-- Watch -->
      <div class="device-icon">🎧</div> <!-- Headphones -->
      <div class="device-icon">🔊</div> <!-- Smart speaker -->
    </div>
  </section>

  <section>
    <div class="launch-notice">
      🚀 2026 Launch Notice: 即將正式推出，敬請期待！
    </div>
  </section>

  <script src="menu.js"></script>
</body>
</html>
