<head>
  <meta charset="UTF-8" />

  <style>
    :root {
      --accent-pink:    #FF9AB5;
      --accent-mint:    #A8E6CF;
      --bg-cream:       #FDFBF7;
      --peach-light:    #FFE5D9;
      --text-main:      #4A3C2F;
      --text-sub:       #6B5E4E;
      --success-blue:   #B2E4FF;
      --shadow-soft:    0 6px 20px rgba(74, 60, 47, 0.08);
      --radius-large:   20px;
      --radius-pill:    999px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Pretendard', system-ui, sans-serif; background: var(--bg-cream); color: var(--text-main); line-height:1.7; }
    nav { background: linear-gradient(135deg, #FDFBF7 0%, #FFE5D9 100%); padding:1.5rem 2rem; position:sticky; top:0; z-index:10; box-shadow:0 2px 10px rgba(74,60,47,0.05); }
    nav ul { display:flex; justify-content:center; list-style:none; gap:2.5rem; }
    nav a { color:var(--text-main); text-decoration:none; font-weight:500; font-size:1.1rem; padding:0.6rem 1.2rem; border-radius:var(--radius-pill); }
    nav a.active { background:var(--accent-pink); color:#fff; }
    header { background: linear-gradient(135deg, #FDFBF7 0%, #FFE5D9 100%); padding:4.5rem 2rem 2.5rem; text-align:center; }
    h1 { font-family: 'Noto Serif KR', serif; color:#E5739D; font-size:2.6rem; }
    .container { max-width:1100px; margin:0 auto; padding:2rem; }
    .chart-card { background:white; padding:1.5rem; border-radius:12px; box-shadow:var(--shadow-soft); }
    canvas { width:100% !important; height:auto !important; aspect-ratio: 16/9; }
    .caption { margin-top:1rem; padding:1rem; background:var(--peach-light); border-radius:8px; font-size:0.95rem; color:var(--text-sub); line-height:1.6; }
    .controls { margin-top:12px; }
    @media (max-width: 768px) {
      .chart-card { padding: 1rem; }
      canvas { aspect-ratio: 4/3; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <nav>
    <ul>
      <li><a href="index.html">首頁</a></li>

      <li><a href="how-it-works.html">如何運作</a></li>
      <li><a href="about-us.html">關於我們</a></li>
      <li><a href="contact-us.html">聯絡我們</a></li>
    </ul>
  </nav>

  <header>
    <h1>統計資料</h1>
    <p class="tagline">學生通過 / 未通過與私人補習的關係（計數）</p>
  </header>

  <div class="container">
    <div class="chart-card">
      <canvas id="chart"></canvas>
      <p class="caption">此圖表顯示學生是否接受私人補習與考試結果的關係。紅色代表未通過（Fail），綠色代表通過（Pass）。數據顯示，沒有接受私人補習的學生中，未通過的人數（8227）遠多於通過的人數（6253）；而接受過私人補習的學生中，通過的人數（4725）遠多於未通過的人數（795）。這表明私人補習與考試通過率呈正相關。</p>
      <div class="controls">
        <button id="downloadBtn">下載 PNG</button>
      </div>
    </div>
  </div>

  <script>
    const data = {
      labels: ['FALSE','TRUE'],
      datasets: [
        { label: 'Pass', backgroundColor: '#4caf50', data: [6253, 4725] },
        { label: 'Fail', backgroundColor: '#f44336', data: [8227, 795] }
      ]
    };

    const config = {
      type: 'bar',
      data,
      options: {
        responsive:true,
        plugins:{ legend:{ position:'top' } },
        scales: { x:{ title:{ display:true, text:'private_tutoring' } }, y:{ beginAtZero:true, title:{ display:true, text:'count' } } }
      }
    };

    const ctx = document.getElementById('chart').getContext('2d');
    const myChart = new Chart(ctx, config);

    document.getElementById('downloadBtn').addEventListener('click', ()=>{
      const a = document.createElement('a');
      a.href = document.getElementById('chart').toDataURL('image/png');
      a.download = 'stats_private_tutoring.png';
      a.click();
    });
  </script>

</body>
</html>
